name: Build keyboard APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test phonetic engine
        run: |
          mkdir -p /tmp/maya-tests
          javac -encoding UTF-8 -d /tmp/maya-tests app/src/main/java/com/maya/keyboard/Phonetic.java tests/PhoneticTest.java
          java -cp /tmp/maya-tests com.maya.keyboard.PhoneticTest
      - name: Use consistent development signature
        run: |
          mkdir -p ~/.android
          cp preview-signing/maya-preview.keystore ~/.android/debug.keystore
      - name: Build and lint
        run: gradle --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Maya-AI-Keyboard-Preview
          path: app/build/outputs/apk/debug/app-debug.apk
