plugins { id 'com.android.application' }
android {
    namespace 'com.maya.keyboard'
    compileSdk 35
    defaultConfig {
        applicationId 'com.maya.keyboard'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-preview'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
